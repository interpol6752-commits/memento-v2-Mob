name: memento_vpn
description: A cyberpunk-themed mobile V2Ray / Xray VPN client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Иконки и UI
  cupertino_icons: ^1.0.8

  # Хранение данных на устройстве
  shared_preferences: ^2.2.2

  # Сетевые запросы (для подписок и брокеров GitHub)
  http: ^1.2.0

  # Генерация QR-кодов для обмена конфигами
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
